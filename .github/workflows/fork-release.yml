name: Fork Release (Windows)

# Builds this fork's Windows installer (with the timer remote controls) and
# uploads it to a DRAFT GitHub release in this repository. Installed copies of
# this fork update from this repository's releases (see UPDATES_OWNER in
# quasar.config.ts), and they ignore drafts: nothing updates until you open the
# draft under Releases and publish it.
#
# The release's version is package.json's `version`, which comes from the
# upstream release merged into this fork. Run this after merging a new
# upstream release. Upstream's own release workflows (manual-release.yml,
# beta-release.yml) only run on sircharlo/meeting-media-manager.
#
# The installer is not code-signed, so Windows SmartScreen warns about an
# unknown publisher the first time it is installed by hand. Updates install
# without that warning. Error reports are off (no Sentry DSN), so this fork's
# builds don't send reports to the official project.

on:
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  quality:
    name: Check version, lint and test
    runs-on: ubuntu-latest
    if: github.repository == 'AnthonyG83/meeting-media-manager'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: version
        name: Read the version and make sure it isn't released yet
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          # Read every release with this tag. `gh release view` can't tell a
          # published release from one of several drafts that share a tag.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"v$version\" and (.draft | not))] | length")
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"v$version\" and .draft)] | length")
          if [ "$published" != "0" ]; then
            echo "::error::v$version is already published in this repository. Merge a newer upstream release (or raise the version in package.json) first."
            exit 1
          fi
          if [ "$drafts" != "0" ]; then
            echo "$drafts draft(s) for v$version exist already: they will be replaced by one new draft once the build succeeds."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev
      - name: Install dependencies
        run: yarn install
      - name: Prepare Quasar
        run: yarn quasar prepare
      - name: Lint files
        run: yarn lint
      - name: Run tests
        run: yarn test:unit

  build-windows:
    name: Build and upload the Windows installer
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # No yarn cache for a release build, like upstream's build.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install
      # Build only. Letting electron-builder publish (--publish=always) made
      # two drafts on 24 Nov 2026: the NSIS and portable targets upload in
      # parallel, both found no release for the tag and both created one, so
      # the installer, portable build and latest.yml landed in one draft and
      # the installer's blockmap in another. The draft is made below instead,
      # in one step, once every file is known to be there.
      - name: Build Electron app
        shell: bash
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build --publish=never
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ''
          SENTRY_DSN: ''
          TEST_VERSION: 'false'
      - name: Check the installer and the update file
        id: files
        shell: bash
        run: |
          version='${{ needs.quality.outputs.version }}'
          dir=dist/electron/Packaged
          files=(
            "$dir/meeting-media-manager-$version-x64.exe"
            "$dir/meeting-media-manager-$version-x64.exe.blockmap"
            "$dir/meeting-media-manager-$version-portable.exe"
            "$dir/latest.yml"
          )
          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty: not making a draft. Installed copies can't update without the installer and latest.yml."
              exit 1
            fi
          done
          # latest.yml must describe this version's installer, byte for byte,
          # or the auto-updater rejects the download.
          if ! grep -q "^version: $version\$" "$dir/latest.yml"; then
            echo "::error::latest.yml isn't for version $version."
            exit 1
          fi
          if ! grep -q "^path: meeting-media-manager-$version-x64.exe\$" "$dir/latest.yml"; then
            echo "::error::latest.yml doesn't point at meeting-media-manager-$version-x64.exe."
            exit 1
          fi
          expected=$(sed -n 's/^sha512: //p' "$dir/latest.yml")
          actual=$(openssl dgst -sha512 -binary "$dir/meeting-media-manager-$version-x64.exe" | openssl base64 -A)
          if [ "$expected" != "$actual" ]; then
            echo "::error::latest.yml's checksum doesn't match the installer."
            exit 1
          fi
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/release-files.txt"
      - name: Replace old drafts with one new draft release
        shell: bash
        run: |
          version='${{ needs.quality.outputs.version }}'
          # Only drafts are removed: the quality job stops the workflow if
          # this version is already published.
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"v$version\" and .draft) | .id"); do
            echo "Removing old draft $id for v$version"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          mapfile -t files < "$RUNNER_TEMP/release-files.txt"
          gh release create "v$version" "${files[@]}" \
            --draft --title "$version" --target "$GITHUB_SHA" \
            --notes "Windows build of this fork for upstream $version."
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"v$version\" and .draft)] | length")
          if [ "$count" != "1" ]; then
            echo "::error::Expected one draft for v$version, found $count."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summary
        shell: bash
        run: |
          echo "Draft release v${{ needs.quality.outputs.version }} is ready, with the installer, the portable build and latest.yml: open Releases in this repository, check it, then publish it so installed copies update." >> "$GITHUB_STEP_SUMMARY"
